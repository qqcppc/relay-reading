<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>릴레이 낭독</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f4ef;color:#24211c;margin:0 auto;padding:20px 16px 24px;display:grid;gap:12px;max-width:520px}
.line{box-sizing:border-box;background:#fff;border:2px solid #e2ddd2;border-radius:12px;padding:14px;display:grid;gap:10px}
.line.sel{border-color:#b4432f}.line.done .t{color:#2f5d50}
.t{font-size:var(--fs,1.15rem);line-height:1.6;cursor:pointer}
.tag{font-size:.8rem;color:#7a7366}
.line{scroll-margin:16px 0}
.card-trigger{border:0;background:transparent;padding:0;text-align:left;color:inherit;font:inherit;display:grid;gap:10px;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.line.recording .vn{animation:record-pulse 1s infinite}
@keyframes record-pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.line.recording .vn{animation:none}}
#identity{width:100%;box-sizing:border-box;display:flex;gap:6px;align-items:center}
#identity label{display:grid;gap:8px;font-weight:600}#reader{width:0;flex:1;min-width:0;padding:10px;border:0;border-bottom:1px dashed #bdb5a5;background:transparent;text-align:right;border-radius:10px;font:inherit}
#identity button{white-space:nowrap;padding:10px 16px;border:0;border-radius:10px;background:#2f5d50;color:#fff;font:inherit}
#identity #book-open{max-width:42%;overflow:hidden;text-overflow:ellipsis;background:#e8e3d8;color:#24211c;padding:10px}
#book-picker{width:min(420px,calc(100% - 48px));max-height:75dvh;padding:18px;border:0;border-radius:16px;background:#f6f4ef}#book-picker::backdrop{background:#0006}
#picker-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}#picker-title{flex:1;margin:0;font-size:1.1rem;overflow-wrap:anywhere}
#picker-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:55dvh;overflow:auto}#picker-items.chapters{grid-template-columns:repeat(5,minmax(0,1fr))}
#picker-items button,#picker-head button{padding:12px 8px;border:1px solid #d2cbbc;border-radius:9px;background:white;font:inherit;overflow-wrap:anywhere}#picker-items button[aria-current=true]{border-color:#b4432f;color:#b4432f}
.line{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.line.recording{border-color:#b4432f;background:#fff0e9}.pager{display:grid!important;grid-template-columns:1fr 3fr 1fr;align-items:stretch}.pager #page-label{display:flex;align-items:center;justify-content:center;text-align:center;font-size:.9rem;border:1px solid #2f5d50;border-radius:10px;background:#fff;cursor:pointer;line-height:1.3}
#top{display:flex;justify-content:center;align-items:center;gap:8px}#top h1{margin:0;text-align:center;font-size:1.6rem}#top button{border:1px solid #d2cbbc;background:#fff;border-radius:9px;padding:6px 10px;font:inherit;color:#7a7366}
.line{position:relative}.tag{position:absolute;top:6px;right:12px;font-size:.75rem;color:#2f5d50}.tag:empty{display:none}.line.done{padding-top:20px;background:#eef5f0;border-color:#cfe2d6}
.vn{font-size:.7em;font-weight:700;color:#9a9283;vertical-align:.35em}.line.recording .vn{color:#b4432f}
#progress{display:flex;gap:2px;height:14px}#progress:empty{display:none}.seg{flex:1;min-width:0;padding:0;border:0;border-radius:3px;background:#e2ddd2}.seg.done{background:#5f9a85}.seg.cur{outline:2px solid #b4432f;outline-offset:1px}
#ok,#listen,#no{color:#fff!important;border:0!important;font-size:1.3rem!important;font-weight:700}#ok{background:#2f7d4f!important}#listen,#center{background:#33557a!important;color:#fff!important}#no{background:#c0392b!important}
#edit-toggle{background:#fff!important;color:#7a7366!important;border:1px solid #d2cbbc!important;padding:10px 12px!important}
#editor:not([open]){display:none}
#top h1{cursor:pointer}#top h1::after{content:' ▾';font-size:.6em;color:#9a9283}
.nwrap{flex:1;display:flex;min-width:0}.nwrap #reader{width:100%}
#identity #font-down,#identity #font-up,#identity #edit-toggle{background:#fff!important;color:#7a7366!important;border:1px solid #d2cbbc!important;padding:10px 10px!important}
#center{border:0;border-radius:10px;font:inherit;font-size:.95rem;padding:10px 4px;cursor:pointer}#center #page-label{border:0!important;background:none!important;display:inline!important;color:inherit;font-size:inherit}
.line{border-left-width:5px;border-left-color:var(--pc,#e2ddd2)}.line.done{background:color-mix(in srgb,var(--pc) 12%,#fff);border-color:color-mix(in srgb,var(--pc) 35%,#fff);border-left-color:var(--pc)}.line.sel{border-color:#b4432f}.tag{color:var(--pc,#2f5d50);font-weight:600}.line.done .t{color:inherit}
.seg.done{background:var(--pc,#5f9a85)}
[data-n]{position:relative}[data-n]::after{content:attr(data-n);position:absolute;top:-7px;left:-5px;font:700 10px/14px system-ui;min-width:14px;text-align:center;background:#24211c;color:#fff;border-radius:7px;pointer-events:none;z-index:5}
[hidden]{display:none!important}
#st:empty{display:none}#st{text-align:center;color:#7a7366;font-size:.9rem}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px;font-size:.95rem;border-radius:10px;border:1px solid #ccc;background:#fff}
#identity #all{padding:10px 14px;background:#2f5d50;color:#fff;font-size:1rem}
#prev-page,#next-page{font-size:1.8rem!important;line-height:1;padding:6px!important}
#editor summary{list-style:none;cursor:pointer;color:#7a7366;width:max-content}#editor summary::-webkit-details-marker{display:none}
#picker-items.testaments{grid-template-columns:1fr 1fr;align-items:start}.col{display:grid;gap:6px}.col h3{margin:0 0 2px;font-size:.85rem;color:#7a7366;text-align:center}#picker-items .col button{padding:8px 4px}#picker-items button:disabled,#picker-items button.empty{opacity:.45}
</style></head><body>
<header id="top"><h1 id="version" role="button" aria-label="책 찾기" data-n="1">#21</h1></header>
<h2 id="heading" hidden>🎤 릴레이 녹음 시험</h2>
<form id="identity"><button id="all" type="button" hidden>▶</button><span class="nwrap" data-n="2"><input id="reader" required maxlength="80" autocomplete="nickname" placeholder="✎ 이름" aria-label="내 이름"></span><button id="edit-toggle" type="button" aria-label="본문 편집" data-n="3">✎</button><button id="font-down" type="button" aria-label="글자 작게" data-n="4">가−</button><button id="font-up" type="button" aria-label="글자 크게" data-n="5">가+</button><button id="book-open" type="button" hidden>책</button></form>
<dialog id="book-picker" aria-labelledby="picker-title"><div id="picker-head"><button id="picker-back" type="button" hidden aria-label="책 목록">◀</button><h2 id="picker-title">책</h2><button id="picker-close" type="button" aria-label="닫기">✕</button></div><div id="picker-items"></div></dialog>
<p id="connection" role="status" hidden>폰 안에서만 도는 시험 모드 · 새로고침하면 녹음 삭제</p>
<div class="row"><button id="refresh" hidden>공유 본문·목록 새로고침</button><button id="disconnect" hidden>연결 지우고 시험 모드</button></div>
<details id="editor"><summary hidden>본문 편집</summary>
<label for="text-input">첫 줄 제목 · # 책이름 · 빈 줄로 줄 구분 · ---로 장 구분 · @장 제목 | 시작 절 번호</label>
<textarea id="text-input" rows="10" style="width:100%;box-sizing:border-box"></textarea>
<p><strong>본문을 저장하면 기존 녹음이 모두 지워짐.</strong></p>
<label><input id="erase-confirm" type="checkbox">기존 녹음 삭제에 동의</label>
<button id="save-text">본문 저장</button></details>
<nav class="row pager" aria-label="본문 장"><button id="prev-page" aria-label="이전 장" data-n="6">‹</button><button id="center" type="button" data-n="7"><span id="play-ic">▶</span> <span id="page-label"></span></button><button id="next-page" aria-label="다음 장" data-n="8">›</button></nav>
<div id="progress" aria-label="녹음 진행" data-n="9"></div>
<div id="list" data-n="10"></div>
<div id="st" role="status"></div>
<div id="review" hidden>
  <audio id="au" hidden></audio>
  <div class="row"><button id="ok" aria-label="확인" data-n="11">✓</button><button id="listen" aria-label="듣기" data-n="12">▶</button><button id="no" aria-label="취소" data-n="13">✕</button></div>
</div>

<script src="storage.js?v=21"></script>
<script src="ui.js?v=21"></script>
</body></html>
