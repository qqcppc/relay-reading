.line{border-left-width:5px;border-left-color:var(--pc,var(--border))}.line.done{background:color-mix(in srgb,var(--pc) 12%,var(--surface));border-color:color-mix(in srgb,var(--pc) 35%,var(--surface));border-left-color:var(--pc)}.line.sel{border-color:var(--terra)}.tag{color:var(--pc,var(--green));font-weight:600}.line.done .t{color:inherit}
.seg.done{background:var(--pc,var(--green))}

#top button{border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;font:inherit;padding:8px 0;min-width:0}#prev-page,#next-page{font-size:1.6rem!important;line-height:1}
#title-btn{display:grid;align-content:center;cursor:pointer;border-color:var(--blue)!important}#version{font-size:1.15rem;font-weight:800}#ver-sub{color:var(--muted);font-size:.75rem}

/* #23 톤 정리·카드 압축·덮개 버튼 */
body{gap:10px}
#center,#listen{background:var(--blue)!important}#ok{background:var(--green)!important}#no{background:var(--terra)!important}
#title-btn{border-color:var(--blue)!important}
.line{padding:10px 12px;border-width:1px;border-left-width:3px;gap:0}
.line.done{background:color-mix(in srgb,var(--pc) 7%,var(--surface));border-color:var(--border);border-left-color:var(--pc)}
.line.sel{border-color:var(--terra);border-left-color:var(--terra)}
.card-trigger{display:block!important}
.side{float:left;display:grid;justify-items:center;margin:.15em 8px 0 0;min-width:1.7em;padding:0;position:relative}
.vn{position:relative;z-index:1;font-size:.8rem!important;font-weight:700;color:var(--number);line-height:1.5}
.tag{font-size:.6rem!important;color:var(--pc)!important;line-height:1.1}
.t{display:block;line-height:1.5}
.line.recording .vn{color:var(--on-accent)!important;animation:none}
.line.recording .side::before{content:'';position:absolute;top:-.1em;left:50%;width:1.6em;height:1.6em;margin-left:-.8em;border-radius:50%;background:var(--record);animation:rec 1s ease-in-out infinite}
@keyframes rec{50%{opacity:.35;transform:scale(.85)}}
.line.recording{background:var(--surface);border-color:var(--record);border-left-color:var(--record)}
#review{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(1px);display:flex;align-items:center;padding:0 12px;border-radius:inherit;z-index:3}
#review .row{width:100%}#review button{padding:14px 0!important}
.seg.done{background:var(--pc)}.seg{opacity:.9}
.me{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid var(--pc,#5f8f74);border-radius:12px;background:var(--surface);margin-bottom:12px}
.me-tag{background:var(--pc,#5f8f74);color:var(--on-accent);border-radius:8px;padding:2px 8px;font-weight:700;font-size:.85rem}
.me #reader{border:0!important;text-align:left!important;width:auto!important}
.me input{flex:1;min-width:0;border:0;font:inherit;font-size:1.05rem;background:transparent;padding:6px 0}.me small{color:var(--muted)}
#people-list{display:flex!important;flex-wrap:wrap;gap:8px}#people-list li{display:flex;gap:6px;align-items:baseline;padding:8px 12px;border:0;border-radius:999px;background:color-mix(in srgb,var(--pc) 14%,var(--surface));border-left:0}
#people-list li b{color:color-mix(in srgb,var(--pc) 75%,var(--ink));font-size:1.05rem}#people-list li small{color:var(--muted)}
.line.done{padding-top:10px!important}
[data-n]{position:relative}[data-n]::after{content:attr(data-n);position:absolute;top:-7px;left:-5px;font:700 10px/14px system-ui;min-width:14px;text-align:center;background:var(--badge-bg);color:var(--badge-text);border-radius:7px;pointer-events:none;z-index:5}

/* #27 */
#sticky{position:sticky;top:0;z-index:20;display:grid;gap:8px;background:var(--bg,#f6f4ef);margin:-20px -16px 0;padding:12px 16px 8px;box-shadow:0 6px 10px -10px #0004}
#center{padding:9px!important}
.tag{display:none!important}
.t{word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
.line.recording{background:#fdf1ef!important;border-color:#e4a59c!important;border-left-color:#d0392b!important;animation:recbg 1.6s ease-in-out infinite}
@keyframes recbg{50%{background:#fbe3df}}
body.is-recording::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px #d0392b;opacity:.55;animation:recframe 1.6s ease-in-out infinite;z-index:30}
@keyframes recframe{50%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.line.recording,body.is-recording::after{animation:none}}
#people-list{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#people-list li{display:grid!important;justify-items:center;gap:2px;padding:10px 4px!important;border-radius:14px!important;min-width:0}
#people-list li b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me-name{flex:1;text-align:left;border:0;background:none;font:inherit;font-size:1.1rem;font-weight:700;padding:6px 0;color:inherit}

#me-ok{border:0;border-radius:9px;background:#4f7a64;color:#fff;padding:8px 12px;font:inherit}
#ok svg,#listen svg,#no svg{display:block;margin:auto}
