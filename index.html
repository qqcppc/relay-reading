<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>녹음 시험</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f4ef;color:#24211c;margin:0 auto;padding:20px 16px;display:grid;gap:12px;max-width:520px}
.line{background:#fff;border:2px solid #e2ddd2;border-radius:12px;padding:14px;display:grid;gap:10px}
.line.sel{border-color:#b4432f}.line.done .t{color:#2f5d50}
.t{font-size:1.15rem;line-height:1.6;cursor:pointer}
.tag{font-size:.8rem;color:#7a7366}
#hold{position:sticky;bottom:12px;width:100%;padding:24px;font-size:1.2rem;border:0;border-radius:16px;background:#b4432f;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#hold.on{background:#7a1f10}
#st{text-align:center;color:#7a7366;font-size:.9rem}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px;font-size:.95rem;border-radius:10px;border:1px solid #ccc;background:#fff}
#all{padding:12px;border-radius:10px;border:0;background:#2f5d50;color:#fff;font-size:1rem}
</style></head><body>
<h2 id="heading">🎤 릴레이 녹음 시험</h2>
<form id="identity"><label>읽는 사람 이름 <input id="reader" required maxlength="80" autocomplete="nickname"></label> <button>이름 기억</button></form>
<p id="connection" role="status">폰 안에서만 도는 시험 모드 · 새로고침하면 녹음 삭제</p>
<div class="row"><button id="refresh" hidden>공유 본문·목록 새로고침</button><button id="disconnect" hidden>연결 지우고 시험 모드</button></div>
<details id="editor"><summary>본문 편집</summary>
<label for="text-input">첫 줄은 제목, 다음 줄부터 빈 줄로 절 구분</label>
<textarea id="text-input" rows="10" style="width:100%;box-sizing:border-box"></textarea>
<p><strong>본문을 저장하면 기존 녹음이 모두 지워짐.</strong></p>
<label><input id="erase-confirm" type="checkbox">기존 녹음 삭제에 동의</label>
<button id="save-text">본문 저장</button></details>
<button id="stop-play">■ 재생 멈추기</button>
<button id="all">▶ 처음부터 이어듣기</button>
<div id="list"></div>
<div id="st">줄을 골라 아래 버튼을 꾹 누르고 읽기</div>
<div id="review" hidden>
  <audio id="au" controls style="width:100%"></audio>
  <div class="row"><button id="ok">✅ 확인</button><button id="re">🔁 다시</button><button id="no">✖ 취소</button></div>
</div>
<button id="hold">꾹 누르고 읽기</button>
<script src="storage.js"></script>
<script src="ui.js"></script>
</body></html>
